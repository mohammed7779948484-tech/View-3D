name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners check out with CRLF by default, like the owner's machine; .gitattributes must cope.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm snapshots:png
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-images
          path: snapshots-png
      # The app: build it, then drive it with Playwright. Ubuntu 24.04 blocks the unprivileged user
      # namespaces Chromium's sandbox needs unless this AppArmor switch is off; Linux has no display, so xvfb.
      - run: pnpm build
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a pnpm exec playwright test
      - if: matrix.os == 'windows-latest'
        run: pnpm exec playwright test
      # English and Arabic screenshots for the owner to review (test/e2e/arabic.spec.ts).
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.os }}
          path: test-results/screens
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore
